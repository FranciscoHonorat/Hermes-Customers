services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mundo-invest-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - mundo-invest-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: customers/Dockerfile
    container_name: mundo-invest-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_DSN: "/data/mundo_invest.db"
      RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
      # Preencha abaixo para modo real (sem elas a API roda em modo simulado)
      # PIPEFY_API_TOKEN: "seu_token_aqui"
      # PIPEFY_PIPE_ID: "seu_pipe_id_aqui"
      # Sem elas, os endpoints de escrita rodam sem autenticação/verificação
      # de assinatura (aceitável em dev local, nunca em produção)
      # API_AUTH_TOKEN: "defina_um_token_forte_aqui"
      # PIPEFY_WEBHOOK_SECRET: "defina_um_segredo_forte_aqui"
    volumes:
      - db_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mundo-invest-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: mundo-invest-api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CUSTOMERS_SERVICE_URL: "http://api:8080"
      RATE_LIMIT_PER_SECOND: "10"
      RATE_LIMIT_BURST: "20"
      # ALLOWED_ORIGINS: "http://localhost:3000"
    depends_on:
      - api
    networks:
      - mundo-invest-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  mundo-invest-network:
    driver: bridge
