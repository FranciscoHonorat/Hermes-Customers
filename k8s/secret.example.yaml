# Template — NÃO aplique este arquivo diretamente e NUNCA commite a versão
# com valores reais. Copie para secret.yaml (ignorado pelo Git, ver
# .gitignore) e preencha localmente, ou gere via `kubectl create secret`.
# Ver ADR-0006 (docs/adr/0006-gestao-de-segredos-pendente.md) para a
# discussão de longo prazo (Sealed Secrets / External Secrets + AWS Secrets
# Manager) — este template resolve só o risco imediato de segredo real
# versionado no Git.
#
# Alternativa recomendada, sem nunca escrever o valor em disco fora do cluster:
#   kubectl create secret generic mundo-invest-secrets \
#     --from-literal=PIPEFY_API_TOKEN="$PIPEFY_API_TOKEN" \
#     --from-literal=PIPEFY_PIPE_ID="$PIPEFY_PIPE_ID" \
#     --from-literal=API_AUTH_TOKEN="$API_AUTH_TOKEN" \
#     --from-literal=PIPEFY_WEBHOOK_SECRET="$PIPEFY_WEBHOOK_SECRET"
apiVersion: v1
kind: Secret
metadata:
  name: mundo-invest-secrets
  namespace: default
type: Opaque
stringData:
  PIPEFY_API_TOKEN: "seu_token_aqui"
  PIPEFY_PIPE_ID: "seu_pipe_id_aqui"
  API_AUTH_TOKEN: "gere_um_token_forte_aqui"
  PIPEFY_WEBHOOK_SECRET: "gere_um_segredo_forte_aqui"
