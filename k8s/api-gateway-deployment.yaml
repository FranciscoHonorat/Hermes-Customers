apiVersion: apps/v1
kind: Deployment
metadata:
  name: mundo-invest-gateway
  namespace: default
  labels:
    app: mundo-invest-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mundo-invest-gateway
  template:
    metadata:
      labels:
        app: mundo-invest-gateway
    spec:
      containers:
        - name: api-gateway
          # Publicada por .github/workflows/docker-publish.yml. Em produção,
          # troque `latest` pela tag imutável do SHA (ver comentário no
          # workflow e achado #23 da auditoria).
          image: ghcr.io/franciscohonorat/mundo-invest-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mundo-invest-gateway-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
