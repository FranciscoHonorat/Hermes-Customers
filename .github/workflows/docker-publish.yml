name: Build & Publish Images

# Publica no GitHub Container Registry usando GITHUB_TOKEN — não exige
# nenhum secret adicional configurado no repositório. As imagens ficam em
# ghcr.io/<owner>/mundo-invest-customers e ghcr.io/<owner>/mundo-invest-gateway,
# sempre com uma tag imutável pelo SHA do commit além de `latest`
# (ver achado #23 da auditoria — k8s/*.yaml hoje ainda referenciam `latest`
# por simplicidade; produção deveria fixar a tag pelo SHA publicado aqui).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: mundo-invest-customers
            context: .
            dockerfile: customers/Dockerfile
          - image: mundo-invest-gateway
            context: ./api-gateway
            dockerfile: api-gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
