name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [customers, api-gateway]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt (falha se algum arquivo estiver fora do padrão)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -race -cover
